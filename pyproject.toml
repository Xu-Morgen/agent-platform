[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "通用 Agent 服务平台"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "langgraph>=1.2.11",
    "pydantic>=2.10,<3",
    "packaging>=24,<27",
    "uvicorn>=0.34,<1",
]

[project.scripts]
agent-platform = "agent_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
